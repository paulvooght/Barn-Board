<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- The board image is dynamic (Supabase board_image_config), so a static
         image preload would be wasted for returning users. Instead, warm the
         Supabase connection so the actual image + data fetch fast.
         Two preconnects on purpose: the board image loads non-CORS (<img>), while
         the REST/auth calls are CORS (they send an Authorization header). Browsers
         keep separate connection pools for each, so warming both means neither the
         image nor the first auth/data fetch has to open a cold socket. -->
    <link rel="preconnect" href="https://omsucewpjhfqjnpqdmsh.supabase.co" />
    <link rel="preconnect" href="https://omsucewpjhfqjnpqdmsh.supabase.co" crossorigin />
    <title>Barn Board</title>
    <!-- Fonts are self-hosted (see src/main.jsx — @fontsource DM Sans + Kodchasan):
         bundled with the app and precached by the service worker, so there's no
         Google Fonts round-trip and no flash-of-fallback after the first load. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
